name: CI - car-rental-service

on:
  push:
    branches: [main]
    paths:
      - 'apps/car-rental-service/**'
      - '.github/workflows/ci-car-rental.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: car-rental-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded pull request runs only. A run on main may already have
  # published an image: cancelling it would leave that image without signature
  # or attestations.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/car-rental-service

jobs:
  test:
    name: Java tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '17'
          distribution: corretto
          cache: gradle
          cache-dependency-path: |
            apps/car-rental-service/*.gradle
            apps/car-rental-service/gradle/wrapper/gradle-wrapper.properties

      - name: Run tests
        working-directory: apps/car-rental-service
        run: ./gradlew clean test --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: java-test-reports
          path: |
            apps/car-rental-service/build/test-results/test/
            apps/car-rental-service/build/reports/tests/test/
          if-no-files-found: error
          retention-days: 7

  quality:
    name: Java quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '17'
          distribution: corretto
          cache: gradle
          cache-dependency-path: |
            apps/car-rental-service/*.gradle
            apps/car-rental-service/gradle/wrapper/gradle-wrapper.properties

      - name: Run Checkstyle
        working-directory: apps/car-rental-service
        run: ./gradlew checkstyleMain checkstyleTest --no-daemon

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: java-quality-reports
          path: apps/car-rental-service/build/reports/checkstyle/
          if-no-files-found: error
          retention-days: 7

  docker:
    name: Java Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [test, quality]
    permissions:
      contents: read
      packages: write
    # Downstream jobs reference the image only by the digest Buildx reports.
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Compute lowercase image name
        id: image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        # GHCR refuses uppercase characters, which a repository name may contain.
        run: echo "name=${IMAGE,,}" >> "$GITHUB_OUTPUT"

      - name: Build and optionally push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/car-rental-service
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=car-rental-service
          cache-to: type=gha,scope=car-rental-service,mode=max

  supply-chain:
    name: Java supply chain
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: docker
    # Evidence only exists for an image that was actually published.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write # push the signature and the attestations next to the image
      id-token: write # OIDC token exchanged for a short-lived Sigstore certificate
      attestations: write # store the attestations in GitHub
      artifact-metadata: write # storage record created by actions/attest
    env:
      IMAGE: ${{ needs.docker.outputs.image }}
      DIGEST: ${{ needs.docker.outputs.digest }}
      IMAGE_REF: ${{ needs.docker.outputs.image }}@${{ needs.docker.outputs.digest }}
      SBOM_FILE: sbom-java.spdx.json

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SPDX SBOM from the published digest
        uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          image: ${{ env.IMAGE_REF }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: ${{ env.SBOM_FILE }}
          artifact-name: ${{ env.SBOM_FILE }}
          upload-artifact-retention: 7

      - name: Install Cosign
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4

      - name: Sign image with the workflow identity
        run: cosign sign --yes "$IMAGE_REF"

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          sbom-path: ${{ env.SBOM_FILE }}
          push-to-registry: true

      - name: Verify Cosign signature
        env:
          CERTIFICATE_IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
        run: |
          cosign verify \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$IMAGE_REF"

      - name: Verify provenance attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify "oci://$IMAGE_REF" --repo "$GITHUB_REPOSITORY"

      - name: Summarize verified evidence
        env:
          CERTIFICATE_IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
        run: |
          {
            echo "### Java image evidence"
            echo "- Verified digest: \`$DIGEST\`"
            echo "- Certificate identity: \`$CERTIFICATE_IDENTITY\`"
            echo "- Source commit: \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

  scan:
    name: Java image scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The scan only runs on a digest whose signature and provenance were verified.
    needs: [docker, supply-chain]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read # pull the image by digest
      security-events: write # upload the SARIF report to code scanning

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan the verified digest with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ needs.docker.outputs.image }}@${{ needs.docker.outputs.digest }}
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: trivy-results.sarif
          category: trivy-car-rental
