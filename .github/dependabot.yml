version: 2

# Updates arrive as ordinary pull requests: no auto-merge. Every bump goes through
# the same required checks, and the supply-chain policy keeps the new reference
# immutable (Dependabot rewrites the commit SHA and its readable version comment).
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "chore(deps)"

  # Major Docker updates change the runtime contract of a service (Java 17 to 25,
  # Gradle 8 to 9): they are decided by hand, not proposed every week.
  - package-ecosystem: docker
    directory: /apps/car-rental-service
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: docker
    directory: /apps/pricing-service
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
