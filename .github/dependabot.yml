version: 2

# Updates arrive as ordinary pull requests: no auto-merge. Every bump goes through
# the same required checks, and the supply-chain policy keeps the new reference
# immutable (Dependabot rewrites the commit SHA and its readable version comment).
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: docker
    directory: /apps/car-rental-service
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: docker
    directory: /apps/pricing-service
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
